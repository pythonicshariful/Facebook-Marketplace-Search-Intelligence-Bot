{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div style="min-height: 80vh; display:flex; align-items:center; justify-content:center;">
  <div class="card" style="width: 100%; max-width: 400px; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem;">🚗 Marketplace Bot</h1>
      <p style="color: var(--text-muted); font-size: 0.875rem;">Vehicle Search Intelligence Dashboard</p>
    </div>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <div class="form-group" style="display:flex; align-items:center; gap:0.5rem;">
        <input type="checkbox" id="remember" name="remember" value="1">
        <label for="remember" style="font-size: 0.85rem; color: var(--text-muted); cursor:pointer;">Remember me on this machine</label>
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:0.5rem;">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
